<style>
:root{--bg:#F7F7F5;--side:#EFEFEA;--card:#FFFFFF;--ink:#1A1A1A;--mut:#6B7280;--faint:#9CA3AF;--line:#E7E5DF;--blue:#2563EB;--body:#333333;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#171717;--side:#1E1E1E;--card:#262626;--ink:#EDEDED;--mut:#A3A3A3;--faint:#737373;--line:#333333;--body:#D6D6D6;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
a{color:inherit;text-decoration:none;cursor:pointer}
aside{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--side);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;z-index:20}
body.immersive aside{display:none} body.immersive main{margin-left:0}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;padding:2px 8px 16px}
.logo .lic{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#FFB59E,#FF8FA3);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.logo small{display:block;font-size:10px;font-weight:400;color:var(--faint);letter-spacing:1px}
.sitem{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--ink);margin-bottom:2px}
.sitem:hover{background:rgba(0,0,0,.04)} [data-theme="dark"] .sitem:hover{background:rgba(255,255,255,.06)}
.sitem.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.sgroup{font-size:12px;color:var(--faint);margin:18px 12px 6px;letter-spacing:1px}
.sidefoot{margin-top:auto;padding:14px 12px 2px;font-size:12px;color:var(--faint);line-height:1.9;border-top:1px solid var(--line)}
main{margin-left:260px;padding:18px 34px 70px}
.inner{max-width:860px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 18px;box-shadow:var(--shadow)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink)}
.iconbtns{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;border:none;color:var(--ink)}
.wrap{width:auto;max-width:none;margin:0;padding:0}
h1{font-size:30px;font-weight:600;margin:4px 0 8px;line-height:1.35}
.subtitle{color:var(--mut);font-size:14px;margin-bottom:22px}
h2{font-size:19px;font-weight:600;margin:28px 0 10px;line-height:1.5}
h2.sec{font-size:19px}
h3{font-size:16px;font-weight:600;margin:20px 0 8px}
p{line-height:1.85;margin:10px 0;color:var(--body);font-size:14.5px}
.content a{color:var(--blue)}
strong{font-weight:600}
img{max-width:100%}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.card p{margin:6px 0}
.tag{display:inline-block;background:var(--side);color:var(--mut);border:1px solid var(--line);font-size:12px;border-radius:999px;padding:3px 11px;margin:0 6px 6px 0}
.meta{color:var(--faint);font-size:12.5px;margin-top:8px}
.infobox{background:var(--side);border-radius:12px;padding:16px 18px;margin:16px 0;font-size:13.5px;line-height:1.9;color:var(--body)}
.toc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:16px 0;font-size:13.5px;line-height:2}
.toc a{color:var(--mut)}
blockquote,.vquote{font-size:16.5px;line-height:1.9;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin:16px 0;color:var(--body)}
.viewer{margin:0 auto}
.viewer img{width:100%;border-radius:14px;display:block}
.vcap{color:var(--mut);font-size:13px;text-align:center;margin:10px 0}
.vnav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
.vnav a{background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:999px;box-shadow:var(--shadow);color:var(--ink)}
.video-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin:16px 0}
.video-card .q img{width:100%;border-radius:10px;display:block}
.about-top{display:flex;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px;margin-bottom:16px;flex-wrap:wrap}
.about-top .avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.about-top .avatar img{width:100%;height:100%;object-fit:cover}
table{border-collapse:collapse;width:100%;margin:14px 0}
td,th{border:1px solid var(--line);padding:8px 10px;font-size:13.5px;text-align:left}
ul,ol{margin:10px 0 10px 22px;line-height:1.85;color:var(--body)}
.savebtn{background:#1A1A1A;color:#fff;border-radius:999px;padding:10px 22px;border:none;cursor:pointer;font-size:14px}
.foot{margin-top:44px;font-size:12px;color:var(--faint);text-align:center;line-height:2}
@media(max-width:900px){aside{display:none}main{margin-left:0;padding:14px 16px 60px}}


.viewer{max-width:520px;margin:0 auto;text-align:center}
.viewer img{width:100%;border-radius:6px;border:1px solid var(--line);display:block}
.vcap{font-size:13px;color:var(--muted);margin:12px 0 4px;letter-spacing:1px}
.vquote{font-size:15px;color:#555;margin:0 0 18px}
.vnav{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
.vnav a,.vnav span{font-size:15px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:4px 18px;background:#fff}
.vnav a{color:var(--accent);border-color:var(--accent)}
.vnav span.dis{opacity:.3}
.savebtn{display:block;width:100%;margin:6px 0 18px;padding:10px 0;font-size:15px;color:#fff;background:var(--accent);border:none;border-radius:20px;cursor:pointer}
.viewer img{-webkit-touch-callout:default}

function toggleTheme(){ var d=document.documentElement; var dark=d.getAttribute('data-theme')==='dark'; d.setAttribute('data-theme', dark?'light':'dark'); try{ localStorage.setItem('libtheme', dark?'light':'dark'); }catch(e){} }
document.getElementById('themeBtn').onclick=toggleTheme;
var tb2=document.getElementById('themeBtn2'); if(tb2) tb2.onclick=toggleTheme;
try{ if(localStorage.getItem('libtheme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
var q=document.getElementById('q');
if(q){ q.oninput=function(){ var v=q.value.trim().toLowerCase(); document.querySelectorAll('.content .card, .content .video-card').forEach(function(c){ c.style.display=(!v||c.textContent.toLowerCase().indexOf(v)>=0)?'':'none'; }); }; }
</script>
</body></html>
