document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
if(dx<-60)go('prev');else if(dx>60)go('next');},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go('prev');if(e.key==='ArrowRight')go('next');});
document.getElementById('savebtn').addEventListener('click',function(){
var img=document.querySelector('.viewer img');
fetch(img.src).then(function(r){return r.blob();}).then(function(blob){
var file=new File([blob],'quote-2026-11-12.webp',{type:'image/webp'});
if(navigator.canShare&&navigator.canShare({files:[file]})){return navigator.share({files:[file]});}
window.open(img.src,'_blank');
}).catch(function(){window.open(img.src,'_blank');});
});
})();
</script>
</body></html>
